<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLite Dashboard</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="dashboard">
        <header>
            <div class="brand">
                <span class="logo-icon">⚡</span>
                <h1>DataLite</h1>
            </div>
            <div class="status-indicator" id="statusIndicator"></div>
        </header>

        <div class="main-control">
            <div class="switch-container">
                <label class="switch">
                    <input type="checkbox" id="liteModeToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <p id="statusText">System Ready</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Data Saved</span>
                <span class="stat-value" id="savedDataValue">0 KB</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Blocked</span>
                <span class="stat-value" id="blockedItemsValue">0</span>
            </div>
        </div>

        <footer>
            <button id="resetStats" class="link-btn">Reset Stats</button>
            <small>v1.1</small>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
